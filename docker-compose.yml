services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boo-king-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "file:/app/data/sqlite.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_data:/app/data
    networks:
      - boo-king
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boo-king-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      VITE_PROXY_TARGET: http://backend:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - boo-king

  # ============================================================
  # PRODUCTION: Descomentar para deploy single-container
  # Usar: docker compose up -d
  # ============================================================
  # production:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: boo-king-production
  #   restart: unless-stopped
  #   ports:
  #     - "8080:4000"
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     NODE_ENV: production
  #     DATABASE_URL: "file:/app/data/sqlite.db"
  #     JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  #   volumes:
  #     - backend_data:/app/data
  #   networks:
  #     - boo-king
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "http://localhost:4000/api/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 15s

networks:
  boo-king:
    driver: bridge

volumes:
  backend_data:
    driver: local
