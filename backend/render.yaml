services:
  - type: web
    name: cooking-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cooking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: cooking-db
    plan: free
    databaseName: cooking
    user: cooking
