services:
  - type: web
    name: cooking
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/app/data/sqlite.db
      - key: JWT_SECRET
        generateValue: true
